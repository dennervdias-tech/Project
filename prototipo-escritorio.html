<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escritório Virtual — protótipo</title>
<style>
  body{margin:0;background:#1b1b2a;color:#eee;font-family:system-ui,sans-serif;display:flex;gap:12px;padding:12px;height:100vh;box-sizing:border-box}
  #main{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  canvas{width:100%;max-width:960px;image-rendering:pixelated;border-radius:10px;border:2px solid #3b3b5c;background:#222}
  #side{width:330px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  .card{background:#262640;border:1px solid #3b3b5c;border-radius:10px;padding:10px}
  h3{margin:0 0 6px;font-size:14px;color:#ffb3e6}
  button{background:#7c4dff;border:0;color:#fff;padding:7px 11px;border-radius:8px;cursor:pointer;font-size:13px}
  button.g{background:#2e9e6a}button.r{background:#c0455f}button.s{background:#444466}
  button:hover{filter:brightness(1.15)}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  small{color:#aab}
  ul{margin:4px 0 0;padding-left:18px;font-size:12px}
  #log{font-size:12px;max-height:130px;overflow:auto;color:#cbd}
</style>
</head>
<body>
<div id="main">
  <canvas id="c" width="480" height="270"></canvas>
  <div class="row">
    <button onclick="chegou('Jira')">📥 Chegou item no Jira</button>
    <button onclick="chegou('Freshdesk')">📥 Chegou ticket no Freshdesk</button>
    <button class="s" onclick="novo()">➕ Novo especialista</button>
    <button class="s" onclick="reset()">♻️ Resetar memória</button>
  </div>
  <small>Protótipo visual (dados simulados). Clique num boneco para ver a ficha e a memória dele.</small>
</div>
<div id="side">
  <div class="card" id="aprov"><h3>✅ Aguardando meu ok</h3><small>Nada pendente.</small></div>
  <div class="card" id="ficha"><h3>🧑‍💼 Ficha</h3><small>Clique em um boneco.</small></div>
  <div class="card"><h3>📜 Log</h3><div id="log"></div></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=270;
const NIVEIS=[['Estagiário',0],['Júnior',3],['Pleno',8],['Sênior',15]];
const CORES=['#ff6fb5','#5ec8ff','#ffd24d','#8cf07a','#c79bff','#ff9a5c'];
const BASICO={
 Jira:['Issue = unidade de trabalho com tipo, status e prioridade','Fluxo de status: A fazer → Em andamento → Concluído','Campos: projeto, responsável, labels, sprint'],
 Freshdesk:['Ticket tem status (aberto, pendente, resolvido), prioridade e grupo','Nota privada não é vista pelo cliente','SLA define prazo de primeira resposta']
};
const LICOES={
 Jira:['Itens com label "infra" vão para o time de Infraestrutura','Bugs em produção sempre têm prioridade Alta','Itens sem descrição devem receber pedido de detalhes'],
 Freshdesk:['Clientes VIP: responder em até 1h','Tickets sobre cobrança vão para o grupo Financeiro','Sempre usar nota privada antes de responder o cliente']
};
let estado;
function carregar(){
  try{estado=JSON.parse(localStorage.getItem('esc_proto'))}catch(e){}
  if(!estado){estado={ags:[],n:0};add('Jira','Jo');add('Freshdesk','Fresh');}
  estado.ags.forEach(a=>{a.x=a.x??40;a.y=a.y??200;a.tx=a.x;a.ty=a.y;a.st='idle';a.t=0;a.bal=null});
  estado.pend=[];
}
function salvar(){localStorage.setItem('esc_proto',JSON.stringify({n:estado.n,ags:estado.ags.map(a=>({nome:a.nome,tool:a.tool,cor:a.cor,slot:a.slot,mem:a.mem,aprend:a.aprend,xp:a.xp,feitas:a.feitas}))}))}
function add(tool,nome){
  const slot=estado.ags.length;
  estado.ags.push({nome,tool,cor:CORES[slot%CORES.length],slot,mem:(BASICO[tool]||['Conhecimento básico de '+tool+' (a preencher)']).slice(),aprend:[],xp:0,feitas:0,x:30,y:225});
  estado.n++;
}
function nivel(a){let n=0;NIVEIS.forEach((v,i)=>{if(a.xp>=v[1])n=i});return n}
const mesa=s=>({x:70+(s%4)*95,y:70+Math.floor(s/4)*85});
function log(t){const l=document.getElementById('log');l.innerHTML=`<div>${new Date().toLocaleTimeString()} — ${t}</div>`+l.innerHTML}
function chegou(tool){
  let a=estado.ags.find(x=>x.tool===tool&&x.st==='idle')||estado.ags.find(x=>x.tool===tool);
  if(!a){log('Nenhum especialista em '+tool+'. Contrate um!');return}
  if(a.st!=='idle'){log(a.nome+' está ocupado(a)');return}
  const m=mesa(a.slot);a.tx=m.x;a.ty=m.y+22;a.st='toDesk';a.bal='📥';
  log(`Novo item em ${tool} → ${a.nome} foi chamado(a)`);
}
function novo(){
  const tool=prompt('Qual ferramenta o novo especialista vai cuidar? (ex.: Zabbix)');if(!tool)return;
  const nome=prompt('Nome do boneco?',tool.slice(0,6))||tool;
  add(tool,nome);salvar();log(`🎉 ${nome} contratado(a): especialista em ${tool}, começa como Estagiário com o conhecimento básico`);ui();
}
function reset(){localStorage.removeItem('esc_proto');carregar();ui();log('Memória resetada')}
function decidir(i,ok){
  const p=estado.pend[i];if(!p)return;const a=p.ag;
  estado.pend.splice(i,1);
  if(ok){
    const pool=LICOES[a.tool]||['Lição aprendida sobre '+a.tool+' #'+(a.aprend.length+1)];
    const l=pool.find(x=>!a.aprend.includes(x))||('Refinamento '+(a.aprend.length+1)+' sobre '+a.tool);
    const antes=nivel(a);a.aprend.push(l);a.xp++;a.feitas++;
    log(`✅ Aprovado. ${a.nome} aprendeu: "${l}"`);
    a.st='celebra';a.t=60;a.bal='✨';
    if(nivel(a)>antes){a.bal='⬆️';log(`🏅 ${a.nome} subiu para ${NIVEIS[nivel(a)][0]}!`)}
  }else{log(`❌ Rejeitado. ${a.nome} volta ao trabalho`);a.st='idle';a.bal=null;}
  salvar();ui();
}
function ui(){
  const ap=document.getElementById('aprov');
  ap.innerHTML='<h3>✅ Aguardando meu ok</h3>'+(estado.pend.length?estado.pend.map((p,i)=>`<div style="margin-bottom:8px"><b>${p.ag.nome}</b> (${p.ag.tool})<br><small>${p.txt}</small><div class="row"><button class="g" onclick="decidir(${i},true)">Aprovar</button><button class="r" onclick="decidir(${i},false)">Rejeitar</button></div></div>`).join(''):'<small>Nada pendente.</small>');
  if(sel)ficha(sel);
}
let sel=null;
function ficha(a){
  sel=a;const n=nivel(a);
  document.getElementById('ficha').innerHTML=`<h3>🧑‍💼 ${a.nome} — ${a.tool}</h3><b>${NIVEIS[n][0]}</b> · XP ${a.xp} · ${a.feitas} tarefas<br><small>Conhecimento básico</small><ul>${a.mem.map(x=>`<li>${x}</li>`).join('')}</ul><small>Aprendizados aprovados</small><ul>${a.aprend.length?a.aprend.map(x=>`<li>${x}</li>`).join(''):'<li><i>nenhum ainda</i></li>'}</ul>`;
}
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const a=estado.ags.find(a=>Math.abs(a.x-x)<8&&y>a.y-22&&y<a.y+4);if(a)ficha(a);
});

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function fundo(){
  for(let y=0;y<H;y+=16)for(let x=0;x<W;x+=16)rect(x,y,16,16,(x/16+y/16)%2?'#cdb99a':'#c4af8e');
  rect(0,0,W,38,'#5a5f8f');rect(0,36,W,3,'#3d4170');
  for(let i=0;i<6;i++){rect(30+i*78,8,40,22,'#9fd8ff');rect(30+i*78,8,40,2,'#fff')}
  // copa
  rect(380,190,90,70,'#9ad1a0');rect(384,194,82,62,'#b5e0b9');rect(395,200,30,14,'#7a5230');rect(440,200,16,22,'#ddd');
  ctx.fillStyle='#345';ctx.font='7px monospace';ctx.fillText('COPA ☕',398,226);
  // mesa do usuário
  rect(200,225,80,30,'#6b4a2f');rect(204,229,72,22,'#8a6240');ctx.fillStyle='#fff';ctx.fillText('VOCÊ (diretor/a)',204,222);
  rect(228,214,24,12,'#222');rect(230,216,20,8,'#6cf');
  // plantas
  [[10,60],[455,60],[10,150]].forEach(p=>{rect(p[0],p[1]+8,10,8,'#8a4b2a');rect(p[0]-3,p[1],16,10,'#3f9a4f')});
  // mesas
  estado.ags.forEach(a=>{const m=mesa(a.slot);
    rect(m.x-22,m.y,44,24,'#7a5230');rect(m.x-20,m.y+2,40,18,'#966a3f');
    const on=a.st==='working'||a.st==='toDesk'||a.st==='waiting';
    rect(m.x-8,m.y-10,16,11,'#222');rect(m.x-7,m.y-9,14,8,on?'#7df':'#345');
    rect(m.x-12,m.y+10,24,3,'#ddd');
    ctx.fillStyle='#fff';ctx.font='6px monospace';ctx.fillText(a.tool,m.x-18,m.y+34);
  });
}
function boneco(a,f){
  const x=Math.round(a.x),y=Math.round(a.y),mov=a.st==='idle'||a.st==='toDesk'||a.st==='toUser';
  const pas=mov&&(Math.hypot(a.tx-a.x,a.ty-a.y)>1)?Math.floor(f/6)%2:0;
  rect(x-5,y+2,10,3,'rgba(0,0,0,.25)');
  rect(x-3,y-4+pas,2,6-pas,'#335');rect(x+1,y-4+(1-pas),2,6-(1-pas),'#335');
  rect(x-4,y-13,8,10,a.cor);
  rect(x-3,y-20,6,7,'#f1c9a0');rect(x-3,y-21,6,2,'#4a2c1a');
  rect(x-2,y-17,1,1,'#222');rect(x+1,y-17,1,1,'#222');
  const n=nivel(a);if(n>=1)rect(x-4,y-13,8,1,'#fff');if(n>=3)rect(x-3,y-23,6,2,'#ffd24d');
  ctx.font='6px monospace';ctx.fillStyle='#fff';ctx.fillText(a.nome,x-a.nome.length*1.7,y+11);
  if(a.bal){const bx=x-6,by=y-34;rect(bx,by,14,11,'#fff');rect(bx+5,by+11,3,3,'#fff');ctx.font='8px sans-serif';ctx.fillText(a.bal,bx+2,by+9)}
}
let frame=0;
function mover(a){
  const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);
  if(d>1){a.x+=dx/d*0.7;a.y+=dy/d*0.7;return false}return true;
}
function logica(a){
  if(a.st==='idle'){
    if(mover(a)||Math.random()<0.002){
      if(Math.random()<0.02){a.tx=60+Math.random()*340;a.ty=120+Math.random()*130}
      if(Math.random()<0.004){a.tx=400;a.ty=235;a.bal='☕';setTimeout(()=>{if(a.st==='idle')a.bal=null},2500)}
    }
  }else if(a.st==='toDesk'){if(mover(a)){a.st='working';a.t=180;a.bal='⌨️'}}
  else if(a.st==='working'){if(--a.t<=0){a.st='toUser';a.tx=240+(a.slot%3)*8;a.ty=205;a.bal=null}}
  else if(a.st==='toUser'){if(mover(a)){a.st='waiting';a.bal='?';
    const t=a.tool==='Jira'?'Proposta: comentar pedindo mais detalhes e mudar status para "Em análise"':a.tool==='Freshdesk'?'Proposta: nota privada + atribuir ao grupo Financeiro (prioridade Alta)':'Proposta: classificar e sugerir próximo passo';
    estado.pend.push({ag:a,txt:t});ui();log(`${a.nome} terminou a análise e aguarda seu ok`)}}
  else if(a.st==='celebra'){if(--a.t<=0){a.st='idle';a.bal=null;a.tx=a.x;a.ty=a.y}}
}
function loop(){
  frame++;fundo();
  estado.ags.forEach(logica);
  [...estado.ags].sort((a,b)=>a.y-b.y).forEach(a=>boneco(a,frame));
  requestAnimationFrame(loop);
}
carregar();ui();loop();
// movimento inicial
estado.ags.forEach((a,i)=>{a.tx=100+i*120;a.ty=170});
</script>
</body>
</html>
